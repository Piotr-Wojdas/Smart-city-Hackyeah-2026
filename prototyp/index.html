<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Netless – prototyp</title>
    <!-- Czcionka Inter (SIL OFL) z Google Fonts; bez sieci przeglądarka użyje czcionki systemowej. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-theme="netless">
    <div class="stage">
      <div class="switcher" role="group" aria-label="Wariant prototypu">
        <button data-variant="netless" aria-pressed="true">Netless (samodzielna)</button>
        <button data-variant="mobywatel" aria-pressed="false">Moduł w mObywatelu</button>
      </div>
      <p class="stage-note">Prototyp koncepcyjny • dane fikcyjne • to nie jest oficjalna aplikacja</p>
      <div class="phone-wrap">
        <main class="phone" id="phone"></main>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>
    </div>
    <noscript>Prototyp wymaga włączonej obsługi JavaScript.</noscript>
    <script src="icons.js"></script>
    <script src="app.js"></script>
  </body>
</html>
