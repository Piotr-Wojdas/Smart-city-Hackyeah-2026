# Scenariusz demo: powódź w Stroniu Śląskim (inspirowany wydarzeniami z 15.09.2024, nie rekonstrukcja).
# Mapa: dane OpenStreetMap z katalogu data/stronie-slaskie (polecenie `sztafeta fetch-osm`).
# Gdy danych nie ma, używana jest proceduralna siatka z sekcji `grid` (fallback).
name: flood-stronie
description: Powódź w Stroniu Śląskim – awaria sieci komórkowej, ewakuacja całego, gęsto zaludnionego miasta

map:
  kind: osm
  dir: stronie-slaskie
  osm:
    name: "Stronie Śląskie"
    center: [50.2957, 16.8742]  # szerokość, długość geograficzna
    dist_m: 1800
    network: walk
    zone_buffer_m: 120
  grid:
    seed: 7
    nx: 22
    ny: 16
    spacing: 90.0

scenario:
  start: "2024-09-15T06:00:00+02:00"
  # alert i ewakuacja dotyczą całego miasta; `zone` = tylko strefy zagrożenia z mapy
  area: city
  hub_name: "Urząd / PCZK"
  evac_name: "Szkoła – punkt ewakuacji"
  incident: "POWODZ-2024-09-15"
  timeline:
    - {t_min: 0, kind: network_down, label: "Awaria sieci komórkowej"}
    - {t_min: 10, kind: issue_alert, hazard: FLOOD, action: EVACUATE, msg_type: ALERT}
    - {t_min: 20, kind: dispatch_couriers}
    - {t_min: 30, kind: troll_broadcast, forgery: BAD_SIGNATURE}
    - {t_min: 180, kind: issue_alert, hazard: DAM_FAILURE, action: EVACUATE, msg_type: UPDATE}

params:
  duration_s: 21600
  # Gęsto zaludnione miasto (założenia zespołu, docs/MODEL.md pkt 3 i 5). Zasady radia i routingu
  # są takie same jak w pozostałych presetach.
  population:
    n_residents: 4956      # pełna liczba mieszkańców miasta wg GUS (domyślnie w modelu: 3000)
    settled_share: 0.25    # zwarta zabudowa: ludzie mieszkają w 25% budynków o najgęstszym otoczeniu
  behavior:
    p_comply: 0.92         # 92% poinformowanych rusza do punktu ewakuacji (domyślnie w modelu: 85%)
