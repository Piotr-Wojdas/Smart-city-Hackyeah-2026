[project]
name = "sztafeta"
version = "0.1.0"
description = "Symulacja offline'owego kanału kryzysowego telefon–telefon (koncepcja modułu do mObywatela, HackYeah 2026)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "cryptography>=42",
    "pyyaml>=6.0",
    "typer>=0.12",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "imageio-ffmpeg>=0.5",
]

[project.scripts]
sztafeta = "sztafeta.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]
osm = [
    "osmnx>=2.0",
]

[tool.uv]
default-groups = ["dev", "osm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sztafeta"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]
ignore = [
    "RUF001", # polskie znaki i typografia w napisach
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "osmnx.*",
    "networkx.*",
    "geopandas.*",
    "shapely.*",
    "pandas.*",
    "imageio_ffmpeg.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
